name: Build and Push Docker Images

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build API image
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tournament-maker-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tournament-maker-api:${{ github.sha }}

      # Build Frontend image
      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tournament-maker-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tournament-maker-frontend:${{ github.sha }}

  restart:
    name: Restart deployments
    runs-on: self-hosted
    needs: build-and-push
    steps:
      - name: Restart API
        uses: steebchen/kubectl@v2.0.0
        with:
          config: ${{ secrets.KUBE_CONFIG }}
          command: -n apps rollout restart deploy tournament-maker-api
      - name: Restart frontend
        uses: steebchen/kubectl@v2.0.0
        with:
          config: ${{ secrets.KUBE_CONFIG }}
          command: -n apps rollout restart deploy tournament-maker-frontend